name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "agent/go-service/**"
      - ".codex/skills/pipeline-testing/**"
      - "docs/pipeline-testing.md"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "agent/go-service/**"
      - ".codex/skills/pipeline-testing/**"
      - "docs/pipeline-testing.md"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Run maa-checker
        run: |
          npm ci
          npx @nekosu/maa-tools check

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade maafw --pre

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json

  pipeline-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "agent/go-service/go.mod"
          cache-dependency-path: |
            agent/go-service/go.mod
            agent/go-service/go.sum

      - name: Download compatible MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          tag: v5.11.1
          fileName: "MAA-win-x86_64*"
          out-file-path: "deps"
          extract: true

      - name: Prepare runtime and binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\install\maafw", ".\install\agent" | Out-Null
          Copy-Item -Path ".\deps\bin\*" -Destination ".\install\maafw" -Recurse -Force
          Push-Location ".\agent\go-service"
          go build -o "..\..\install\agent\go-service.exe" .
          go build -o "..\..\install\pipeline-test.exe" ".\cmd\pipeline-test"
          Pop-Location

      - name: Run Pipeline test unit and integration suites
        shell: pwsh
        run: |
          Push-Location ".\agent\go-service"
          go test ./...
          $env:MDA_PIPELINE_TEST_INTEGRATION = "1"
          go test ".\internal\pipelinetest" -run "^TestMaa" -v
          Pop-Location

      - name: Smoke test installed CLI
        shell: pwsh
        run: |
          & ".\install\pipeline-test.exe" node `
            --node "PipelineTestTemplateHit" `
            --image ".\agent\go-service\internal\pipelinetest\testdata\positive.png" `
            --resource ".\agent\go-service\internal\pipelinetest\testdata\resource" `
            --library-dir ".\install\maafw" `
            --no-agent `
            --expect hit `
            --output json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
